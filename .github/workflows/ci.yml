name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Build
        run: go build ./...
      - name: Test
        run: go test -race -shuffle=on -count=1 ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && false)
      - name: go vet
        run: go vet ./... && go vet -tags live ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Plakar manifest validator
        run: go run github.com/PlakarKorp/pkg/cmd/validator@latest repo .
      - name: Coverage
        run: |
          go test -count=1 -coverprofile=coverage.out .
          go tool cover -func=coverage.out | tail -1

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Fuzz
        run: make fuzz FUZZTIME=20s

  live:
    # Runs against the real pCloud API when credentials are configured as
    # repository secrets; skipped otherwise (e.g. on forks).
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    env:
      PCLOUD_ACCESS_TOKEN: ${{ secrets.PCLOUD_ACCESS_TOKEN }}
      PCLOUD_REGION: ${{ secrets.PCLOUD_REGION }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Live tests
        run: go test -tags live -count=1 -run TestLive -v .
