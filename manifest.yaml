name: pcloud
display_name: pCloud
description: Integration providing storage, import, and export capabilities to and from pCloud (US and EU regions).
homepage: https://github.com/sosoihd/plakar-pcloud
contact: https://github.com/sosoihd/plakar-pcloud/issues
license: ISC
tier: community
api_version: v1.1.0
tags: [cloud, pcloud, file-storage]
connectors:
  - type: importer
    class: file-storage
    executable: ./pcloud-importer
    protocols: [pcloud]
    validator: ./cmd/importer/schema.json
  - type: exporter
    class: file-storage
    executable: ./pcloud-exporter
    protocols: [pcloud]
    validator: ./cmd/exporter/schema.json
  - type: storage
    class: file-storage
    executable: ./pcloud-storage
    protocols: [pcloud]
    validator: ./cmd/storage/schema.json
